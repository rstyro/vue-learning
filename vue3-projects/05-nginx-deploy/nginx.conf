# ============================================================
#  05-nginx-deploy / nginx.conf
#  Vue3 项目（02-router）Nginx 生产部署配置
#
#  完整配置 vs 片段：本文件是"可运行"的完整结构（http/server），
#  但核心只有中间的 server 块。Linux 服务器上通常只需把
#  server 块写入 /etc/nginx/conf.d/ 下的 .conf 文件。
#
#  用法一（Windows 本机演示）：
#    1. 下载 Nginx Windows 版：https://nginx.org/en/download.html
#    2. 解压后，把 02-router/dist 里所有文件复制到 nginx 的 html/ 目录
#    3. 用本文件覆盖 nginx 目录下的 conf/nginx.conf
#    4. 在 nginx 目录里执行：nginx.exe          （启动）
#                          nginx.exe -s reload  （改配置后重载）
#    5. 浏览器打开 http://localhost:8080
#
#  用法二（Linux 云服务器）：
#    1. 上传 dist 到服务器（如 /usr/share/nginx/html/vue-app）
#    2. 把下方 server 块写入 /etc/nginx/conf.d/vue-app.conf
#       并把 root 改成你实际的部署目录
#    3. nginx -t          （检查配置语法）
#    4. nginx -s reload   （生效）
# ============================================================

# ---------- 全局块 ----------
worker_processes  1;          # 服务器 CPU 核数；开发机 1 够用

events {
    worker_connections  1024; # 每进程最大连接数
}

http {
    # mime.types 由 nginx 自带：把 .js/.css/.png 等扩展名映射成
    # 正确的 Content-Type。少了它，浏览器可能把 JS 当纯文本下载。
    include       mime.types;
    default_type  application/octet-stream;

    access_log  logs/access.log;
    error_log   logs/error.log;

    sendfile        on;       # 零拷贝发送文件，静态文件性能关键项
    keepalive_timeout  65;    # 长连接超时（秒）

    # ---------- gzip 压缩：文本资源体积平均缩小 60%+ ----------
    gzip  on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;       # 小于 1KB 不压缩（太小压不出收益）
    # gzip_vary on;           # 响应头加 Vary: Accept-Encoding（可打开）

    # ============================================================
    #  ★ 核心：Vue3 应用的 server 块
    # ============================================================
    server {
        # 演示用 8080（避开 Windows 常见的 80 端口占用）；生产用 80
        listen       8080;
        server_name  localhost;   # 生产环境改成你的域名

        # ★ 站点根目录 = 前端 build 产物（dist）所在位置。
        #   root 写相对路径时是相对于"nginx 安装目录"：
        #   - Windows 演示：dist 内容拷进 nginx/html/ 即可用（默认动作）
        #   - Linux 服务器：改成真实路径，如 /usr/share/nginx/html/vue-app
        root  html;

        index  index.html;

        # ----------------------------------------------------------
        # ★★★ 本配置的灵魂：SPA 路由回退（解决"刷新 404"）
        # ----------------------------------------------------------
        # 02-router 用的是 createWebHistory()（HTML5 模式），
        # URL 形如 http://localhost:8080/user/1 —— 没有 #。
        # 浏览器直接敲这个地址 / 按 F5 刷新时，nginx 会去找真实文件
        # /user/1 —— 当然不存在 → 404。
        #
        # try_files 的作用（从左到右依次尝试）：
        #   $uri      → 找真实文件？  有 → 返回它（如 /assets/index-xxx.js）
        #   $uri/     → 找目录？      有 → 返回目录下的 index.html
        #   /index.html → 都找不到 → 兜底交给 index.html，由 Vue Router 接管
        #
        # 注释掉这一行，刷新 /about、/user/1 全部 404 —— 高频面试题！
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ----------------------------------------------------------
        # ★ 静态资源缓存策略
        # ----------------------------------------------------------
        # Vite 构建出的文件名自带内容 hash（index-DC1GgKP8.js），
        # 内容一变 hash 就变，所以可以放心"强缓存"。
        location /assets/ {
            # 命中缓存一律缓存 30 天（200 和 304 都生效）
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            # assets 下都是真实文件，不需要回退 index.html；
            # 找不到就是真 404（=404 返回 404 状态而不是兜底）
            try_files $uri =404;
        }

        # index.html 本身绝不缓存：它引用的 JS/CSS 文件名每次构建都变，
        # 一旦浏览器缓存了旧 index.html，就永远加载不到新版本。
        # 配合上面的"assets 强缓存" = 最优解：HTML 每次最新，静态资源取缓存。
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ----------------------------------------------------------
        # ★ 接口反向代理（呼应 04-complete 的 Mock 服务器）
        # ----------------------------------------------------------
        # 前端代码里的 /api/xxx 请求由 nginx 转发到真实后端：
        #   - 前后端同源，天然无跨域问题
        #   - 后端地址不暴露给浏览器
        # 取消注释并把 3000 改成你的后端端口即可（注意同时配置 proxy_pass
        # 末尾有无 / 的区别：有 / 会去掉匹配到的 /api 前缀再转发）。
        #
        # location /api/ {
        #     proxy_pass http://127.0.0.1:3000/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # }

        # ----------------------------------------------------------
        # 关于"部署到子路径"（如 www.example.com/vue-app/）：
        #   这不是 nginx 能单独解决的 —— 前端构建时就要告诉 Vite
        #   资源的基础路径，否则 index.html 里的 /assets/... 会指向
        #   域名根。在 02-router/vite.config.js 里加：
        #       base: '/vue-app/'
        #   然后重新 npm run build，再按上面的方式部署即可。
        # ----------------------------------------------------------
    }
}
