<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 移动端适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 网页图标：Vite 会自动找 public/ 下的 favicon.ico -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>Vite + Vue 项目结构入门</title>
  </head>
  <body>
    <!-- 挂载点：Vue 应用会渲染到这里 -->
    <div id="app"></div>
    <!-- 入口 JS：main.js 是应用的起点 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
